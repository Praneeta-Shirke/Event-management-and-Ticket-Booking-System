<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>Complete Your Booking</header>

<div class="container narrow">
    <h2>Ticket Selection</h2>
    <p class="section-intro">Choose number of tickets and continue to payment.</p>

    <input id="tickets" type="number" min="1" placeholder="Number of tickets">
    <div class="actions">
        <button type="button" onclick="book()">Confirm Booking</button>
        <a href="/events" class="small">Back to Events</a>
    </div>
</div>

<script>
function book() {
    fetch("/api/bookings", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
        },
        body: JSON.stringify({
            userId: 1,
            eventId: localStorage.getItem("eventId"),
            numberOfTickets: tickets.value
        })
    })
    .then(res => res.json())
    .then(data => {
        localStorage.setItem("bookingId", data.bookingId);
        window.location.href = "/payment";
    })
    .catch(() => alert("Unable to create booking"));
}
</script>

</body>
</html>

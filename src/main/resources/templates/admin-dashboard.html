<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="topbar">
    <div class="brand">Admin Dashboard</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <button type="button" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">
    <h2>All Users</h2>
    <p class="section-intro">Review account roles and create additional admin users.</p>
    <div id="users" class="grid"></div>

    <hr>

    <h2>Create Admin</h2>
    <input id="name" placeholder="Name">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button type="button" onclick="createAdmin()">Create Admin</button>
</div>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "ADMIN") {
    alert("Access denied");
    window.location.href = "/login";
}

function loadUsers() {
    fetch("/api/admin/users", {
        headers: {
            "Authorization": "Bearer " + token
        }
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Unable to load users");
        }
        return res.json();
    })
    .then(data => {
        const div = document.getElementById("users");
        div.innerHTML = "";

        data.forEach(u => {
            div.innerHTML += `
                <div class="card">
                    <strong>${u.name}</strong>
                    <p>${u.email}</p>
                    <p class="small">Role: ${u.role}</p>
                </div>
            `;
        });
    })
    .catch(() => {
        document.getElementById("users").innerHTML =
            "<div class=\"card\"><p class=\"small\">Unable to load users.</p></div>";
    });
}

function createAdmin() {
    fetch("/api/admin/create", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            name: name.value,
            email: email.value,
            password: password.value
        })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Unable to create admin");
        }
        return res.json();
    })
    .then(() => {
        alert("Admin created");
        loadUsers();
    })
    .catch(err => alert(err.message));
}

function logout() {
    localStorage.clear();
    window.location.href = "/login";
}

loadUsers();
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="topbar">
    <div class="brand">Smart Event System</div>
    <div class="nav-links">
        <a href="/events">Events</a>
        <a href="/my-bookings" id="bookingLink">My Bookings</a>
        <a href="/organizer" id="organizerLink" style="display:none">Organizer</a>
        <a href="/admin" id="adminLink" style="display:none">Admin</a>
        <span class="badge" id="userRole">GUEST</span>
        <button type="button" onclick="logout()">Logout</button>
    </div>
</nav>

<section class="hero">
    <div class="hero-copy">
        <h1>Manage events with speed and clarity.</h1>
        <p>Discover experiences, reserve tickets, and track bookings from one streamlined dashboard.</p>
    </div>
    <div class="hero-panel">
        <p class="hero-stat"><strong>24x7</strong>Booking access</p>
        <p class="hero-stat"><strong>Live</strong>Role-based management</p>
        <p class="hero-stat"><strong>Secure</strong>Token-protected APIs</p>
    </div>
</section>

<script>
const role = localStorage.getItem("role");
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/login";
}

document.getElementById("userRole").innerText = role || "USER";

if (role === "ADMIN") {
    document.getElementById("adminLink").style.display = "inline-flex";
}

if (role === "ORGANIZER") {
    document.getElementById("organizerLink").style.display = "inline-flex";
}

function logout() {
    localStorage.clear();
    window.location.replace("/login");
}
</script>

</body>
</html>
